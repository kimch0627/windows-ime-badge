# winget(Windows Package Manager) 등록·갱신.
#
# 정식 릴리스가 만들어지면 build.yml 이 이 워크플로를 부른다(workflow_call). 수동으로도 돌릴 수 있다(workflow_dispatch).
# 1. winget/templates 에서 그 버전의 매니페스트를 만든다(설치 프로그램 SHA256 은 릴리스의 SHA256SUMS.txt 에서).
# 2. 저장소 시크릿 WINGET_TOKEN(public_repo 권한 PAT)이 있으면 wingetcreate 로 microsoft/winget-pkgs 에 PR 을 낸다.
#    (wingetcreate 가 토큰 계정에 winget-pkgs 포크를 만들고 브랜치를 밀어 PR 을 연다.)
#    없으면 매니페스트만 만들고 끝낸다. 절차는 docs/release.md.
name: winget

on:
  workflow_call:
    inputs:
      version:
        description: "릴리스 버전 (v1.2.3 또는 1.2.3)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 (v1.2.3 또는 1.2.3). 해당 Release 가 이미 있어야 한다"
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate manifests
        id: gen
        shell: pwsh
        run: ./tools/winget/New-WingetManifest.ps1 -Version "${{ inputs.version }}" -OutDir out/winget

      - name: Show manifests
        shell: pwsh
        run: Get-ChildItem -Recurse out/winget -Filter *.yaml | ForEach-Object { "----- $($_.Name)"; Get-Content $_.FullName }

      - name: Check WINGET_TOKEN
        id: tok
        shell: pwsh
        env:
          T: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ok = $env:T ? "true" : "false"
          "enabled=$ok" >> $env:GITHUB_OUTPUT
          "winget submit: $ok"

      - name: Submit to microsoft/winget-pkgs (wingetcreate)
        if: steps.tok.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $ver = "${{ inputs.version }}".TrimStart("v")
          $dir = "out/winget/k/kimch0627/ImeBadge/$ver"
          & .\wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: kimch0627.ImeBadge version $ver" $dir
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit failed ($LASTEXITCODE)" }
