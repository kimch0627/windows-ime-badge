# winget(Windows Package Manager) 등록·갱신.
#
# 정식 릴리스가 만들어지면 build.yml 이 이 워크플로를 부른다(workflow_call). 수동으로도 돌릴 수 있다(workflow_dispatch).
# winget 관련 파일이 바뀐 브랜치 푸시에서는 최신 릴리스로 매니페스트만 만들어 스크립트를 검증한다(제출 없음).
# 1. winget/templates 에서 그 버전의 매니페스트를 만든다(설치 프로그램 SHA256 은 릴리스의 SHA256SUMS.txt 에서, GITHUB_TOKEN 으로 API 접근).
# 2. 저장소 시크릿 WINGET_TOKEN(public_repo 권한 PAT)이 있으면 wingetcreate(버전·SHA256 고정)로 microsoft/winget-pkgs 에 PR 을 낸다.
#    (wingetcreate 가 토큰 계정에 winget-pkgs 포크를 만들고 브랜치를 밀어 PR 을 연다.)
#    없으면 매니페스트만 만들고 끝낸다. 절차는 docs/release.md.
#
# 주의: winget 은 설치 프로그램 URL 이 인증 없이 내려받아져야 한다. 저장소가 비공개(private)이면 매니페스트는 만들어져도
#       winget-pkgs 검증에서 거부되므로, 등록하려면 저장소를 공개로 바꿔야 한다.
name: winget

on:
  workflow_call:
    inputs:
      version:
        description: "릴리스 버전 (v1.2.3 또는 1.2.3)"
        required: true
        type: string
      submit:
        description: "WINGET_TOKEN 이 있으면 winget-pkgs 에 제출"
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 (v1.2.3 또는 1.2.3). 비우면 최신 정식 릴리스. 존재하는 릴리스여야 한다"
        required: false
        type: string
        default: ""
      submit:
        description: "WINGET_TOKEN 이 있으면 winget-pkgs 에 제출 (끄면 매니페스트만 생성)"
        required: false
        type: boolean
        default: true
  push:
    branches: ["**"]
    paths:
      - "winget/**"
      - "tools/winget/**"
      - ".github/workflows/winget.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate manifests
        id: gen
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/winget/New-WingetManifest.ps1 -Version "${{ inputs.version }}" -OutDir out/winget

      - name: Show manifests
        shell: pwsh
        run: Get-ChildItem -Recurse out/winget -Filter *.yaml | ForEach-Object { "----- $($_.Name)"; Get-Content $_.FullName }

      - name: Check WINGET_TOKEN
        id: tok
        shell: pwsh
        env:
          T: ${{ secrets.WINGET_TOKEN }}
        run: |
          # 제출은 명시적 입력(submit=true)일 때만. 브랜치 푸시(검증용)에는 입력이 없어 제출하지 않는다.
          # (github.event_name 으로 구분하면 안 된다: build.yml 이 workflow_call 로 부를 때도 호출자의 이벤트 이름 "push" 가 보인다.)
          $ok = ($env:T -and "${{ inputs.submit }}" -eq "true") ? "true" : "false"
          "enabled=$ok" >> $env:GITHUB_OUTPUT
          "winget submit: $ok (event: ${{ github.event_name }}, submit input: '${{ inputs.submit }}', token: $(if ($env:T) { 'set' } else { 'missing' }))"

      - name: Submit to microsoft/winget-pkgs (wingetcreate)
        if: steps.tok.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          # 버전과 SHA256 을 고정해 받는다. 새 버전으로 올릴 때는 두 값을 함께 바꾼다 (docs/release.md).
          $wcVersion = "v1.12.13.0"
          $wcSha256  = "24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA"
          Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/download/$wcVersion/wingetcreate.exe" -OutFile wingetcreate.exe
          $actual = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
          if ($actual -ne $wcSha256) { throw "wingetcreate.exe 해시 불일치: $actual (기대 $wcSha256)" }
          $ver = "${{ steps.gen.outputs.version }}"
          $dir = "out/winget/k/kimch0627/ImeBadge/$ver"
          & .\wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: kimch0627.ImeBadge version $ver" $dir
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit failed ($LASTEXITCODE)" }
