# main에 푸시하거나 v* 태그를 푸시하면 Windows 러너에서 exe를 빌드한다.
# - 모든 빌드: 작은 exe(런타임 필요)를 Actions Artifacts 에 업로드 (7일 보관)
#              계정의 아티팩트 저장 용량이 차면 업로드만 실패하고 빌드는 성공으로 남긴다.
# - v* 태그:   자체 포함 exe까지 빌드하고 GitHub Release 에 두 파일을 첨부
#              (Release 첨부 파일은 Actions 저장 용량을 쓰지 않는다)
# - 수동 실행(Actions 탭 > build > Run workflow)에서 release_tag 를 넣으면 태그 푸시 없이도
#   그 이름으로 태그와 Release 를 만든다.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "릴리스 태그 (예: v0.5.0). 비우면 빌드만 한다"
        required: false
        default: ""

permissions:
  contents: write   # Release 생성에 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ImeBadge.csproj

      - name: Publish (framework-dependent, .NET 8 런타임 필요)
        run: >
          dotnet publish ImeBadge.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none -o out/fd

      - name: Publish (self-contained, 런타임 포함) — 릴리스일 때만
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        # 압축(EnableCompressionInSingleFile)과 언어 리소스 제외는 csproj에 있다.
        run: >
          dotnet publish ImeBadge.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o out/sc

      - name: Rename outputs
        shell: pwsh
        run: |
          Copy-Item out/fd/ImeBadge.exe out/ImeBadge-win-x64.exe
          if (Test-Path out/sc/ImeBadge.exe) { Copy-Item out/sc/ImeBadge.exe out/ImeBadge-win-x64-selfcontained.exe }
          Get-ChildItem out/*.exe | Format-Table Name, Length

      - name: Upload artifact (작은 exe만, 7일 보관)
        uses: actions/upload-artifact@v4
        continue-on-error: true   # 아티팩트 저장 용량 초과 시에도 빌드는 성공 처리
        with:
          name: ImeBadge-win-x64
          path: out/ImeBadge-win-x64.exe
          retention-days: 7
          if-no-files-found: error

      - name: Release (태그 푸시 또는 release_tag 입력일 때만)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            out/ImeBadge-win-x64.exe
            out/ImeBadge-win-x64-selfcontained.exe
