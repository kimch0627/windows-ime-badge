# 빌드·테스트·배포 워크플로.
#
# | 계기                            | 결과물 위치 (Releases 탭)                                       |
# |---------------------------------|-----------------------------------------------------------------|
# | PR                              | 테스트 + 빌드만 (릴리스 없음)                                     |
# | main 에 push                    | `latest` 사전 릴리스를 그 커밋으로 갱신 (고정 주소로 최신 빌드)      |
# | 다른 브랜치에 push              | `dev-<브랜치명>` 사전 릴리스를 그 커밋으로 갱신                    |
# | v* 태그 push / 수동 release_tag | 그 태그의 정식 Release (버전 번호가 exe·설치 프로그램에 새겨진다)   |
# | main 에 `release: vX.Y.Z ...` 제목의 커밋 push | 워크플로가 그 태그를 만들고 정식 Release 생성 (태그를 직접 푸시할 수 없는 환경용) |
#
# 결과물은 CPU 아키텍처(x64, arm64)마다 세 가지: 설치 프로그램(권장), self-contained exe(무설치), framework-dependent exe(.NET 8 런타임 필요).
#   ImeBadge-Setup-<버전>-<arch>.exe / ImeBadge-win-<arch>-selfcontained.exe / ImeBadge-win-<arch>.exe
# arm64 는 x64 러너에서 교차 컴파일한다(dotnet publish -r win-arm64, Inno Setup ArchitecturesAllowed=arm64).
# x86(32-bit) 은 만들지 않는다: Windows 11 에는 32-bit 판이 없고 Windows 10 은 지원이 끝났다.
#
# Actions Artifacts 는 쓰지 않는다. 이 계정은 아티팩트 저장 용량 한도에 걸려 업로드가 실패한다.
# Release 첨부 파일은 그 용량을 쓰지 않는다. 롤링 사전 릴리스는 태그(latest, dev-*)를 강제로 옮기는
# 방식이라 v* 태그 트리거에 걸리지 않는다.
#
# winget: 정식 릴리스 뒤 winget.yml 을 호출해 매니페스트를 만들고, WINGET_TOKEN 이 있으면 winget-pkgs 에 PR 을 낸다.
#
# 코드 서명: 저장소 시크릿 AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / SIGNING_ENDPOINT /
# SIGNING_ACCOUNT / SIGNING_PROFILE 이 모두 있으면 Azure Trusted Signing 으로 exe 와 설치 프로그램에 서명한다.
# 없으면 서명 단계를 건너뛴다(SmartScreen 경고가 뜨는 미서명 빌드). 자세한 절차는 docs/release.md.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "릴리스 태그 (예: v0.5.0). 비우면 빌드만 한다"
        required: false
        default: ""

permissions:
  contents: read   # 기본은 읽기. Release 생성·태그 이동이 필요한 build 잡만 아래에서 write 로 올린다

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Windows 없이 도는 순수 로직 테스트. 빠르게 실패를 알린다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Test (ImeBadge.Core)
        run: dotnet test tests/ImeBadge.Core.Tests/ImeBadge.Core.Tests.csproj -c Release --logger "trx;LogFileName=core.trx"
      - name: Format check (whitespace)
        run: |
          dotnet format whitespace src/ImeBadge.Core/ImeBadge.Core.csproj --verify-no-changes
          dotnet format whitespace tests/ImeBadge.Core.Tests/ImeBadge.Core.Tests.csproj --verify-no-changes

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # Release 생성·태그 이동
    outputs:
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      # 정식 릴리스 태그 결정: 수동 입력 > v* 태그 push > main 커밋 제목 "release: vX.Y.Z ..."
      # 버전 결정: 정식 릴리스면 태그에서(v1.2.3 → 1.2.3), 그 외 → 0.0.0-<브랜치>.g<sha7> (개발 빌드)
      # sha 앞의 "g"(git describe 와 같은 표기): sha7 이 "0879263" 처럼 0 으로 시작하는 숫자뿐이면 SemVer 가 허용하지 않아
      # NuGet 복원이 "is not a valid version string" 으로 실패한다. 글자를 붙이면 늘 올바른 식별자가 된다.
      - name: Decide version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $rel = "${{ inputs.release_tag }}"
          $fromCommit = $false
          if (-not $rel -and $ref -like "refs/tags/v*") { $rel = "${{ github.ref_name }}" }
          if (-not $rel -and $ref -eq "refs/heads/main") {
            $subject = git log -1 --pretty=%s
            if ($subject -match '^release:\s*(v\d+\.\d+\.\d+[0-9A-Za-z.-]*)') { $rel = $Matches[1]; $fromCommit = $true }
          }
          "RELEASE_TAG=$rel" >> $env:GITHUB_ENV
          "release_tag=$rel" >> $env:GITHUB_OUTPUT
          "RELEASE_TAG_FROM_COMMIT=$fromCommit" >> $env:GITHUB_ENV
          if ($rel) { "정식 릴리스 태그: $rel (커밋 메시지에서: $fromCommit)" }

          if ($rel) { $v = $rel.TrimStart("v") }
          else {
            $branch = "${{ github.head_ref || github.ref_name }}" -replace '[^0-9A-Za-z-]', '-'
            $v = "0.0.0-$branch.g$("${{ github.sha }}".Substring(0,7))"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "VERSION=$v" >> $env:GITHUB_ENV
          # 파일 속성용 숫자 버전 "a.b.c.0" (설치 프로그램의 VersionInfoVersion 은 숫자만 받는다)
          $num = ($v -split '[-+]')[0]
          $parts = @($num -split '\.' | ForEach-Object { [int]$_ })
          while ($parts.Count -lt 3) { $parts += 0 }
          $fileVer = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          "FILE_VERSION=$fileVer" >> $env:GITHUB_ENV
          "file version = $fileVer"
          # 롤링 사전 릴리스의 태그 이름: main → latest, 그 외 → dev-<브랜치명> ('/' 등은 '-'로)
          $rb = "${{ github.ref_name }}" -replace '[/\\:<>|*?"~^ ]', '-'
          $tag = if ($ref -eq "refs/heads/main") { "latest" } else { "dev-$rb" }
          "ROLLING_TAG=$tag" >> $env:GITHUB_ENV
          "version = $v, rolling tag = $tag"

      - name: Restore
        run: dotnet restore ImeBadge.sln

      - name: Build (Debug, 전체 솔루션 — 경고를 오류로)
        run: dotnet build ImeBadge.sln -c Debug --no-restore

      - name: Test (Windows)
        run: dotnet test tests/ImeBadge.Core.Tests/ImeBadge.Core.Tests.csproj -c Release --no-restore

      # 아키텍처마다 publish 한다. arm64 는 x64 러너에서 교차 컴파일(런타임 팩 win-arm64 를 NuGet 에서 받는다).
      - name: Publish (framework-dependent, .NET 8 런타임 필요) — x64, arm64
        shell: pwsh
        run: |
          foreach ($arch in "x64", "arm64") {
            "::group::framework-dependent win-$arch"
            dotnet publish src/ImeBadge/ImeBadge.csproj -c Release -r win-$arch --self-contained false `
              -p:PublishSingleFile=true -p:DebugType=none -p:Version=${{ env.VERSION }} -o out/fd-$arch
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish (fd, win-$arch) failed ($LASTEXITCODE)" }
            "::endgroup::"
          }

      # 배지 시안 그림(badge-sheet.png). 렌더러는 GDI+(Windows 전용)라 Linux 테스트로는 모습을 확인할 수 없어 여기서 실제로 그린다.
      # 롤링 사전 릴리스에 붙인다(Actions Artifacts 는 위 주석의 용량 한도 때문에 쓰지 않는다). 개발용이라 실패해도 빌드는 계속한다.
      # WinExe 라 그냥 실행하면 기다리지 않으므로 Start-Process -Wait 로 끝날 때까지 기다리고 종료 코드를 본다.
      - name: Render badge sheet
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $pwd "out/badge-sheet.png"
          $p = Start-Process -FilePath out/fd-x64/ImeBadge.exe -ArgumentList "--render-sheet", "`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { throw "render-sheet failed (exit $($p.ExitCode))" }
          "badge-sheet.png: {0:N0} KB" -f ((Get-Item $out).Length / 1KB)

      - name: Publish (self-contained, 런타임 포함, 트리밍·압축은 csproj 설정) — x64, arm64
        shell: pwsh
        run: |
          foreach ($arch in "x64", "arm64") {
            "::group::self-contained win-$arch"
            dotnet publish src/ImeBadge/ImeBadge.csproj -c Release -r win-$arch --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:DebugType=none -p:Version=${{ env.VERSION }} -o out/sc-$arch
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish (sc, win-$arch) failed ($LASTEXITCODE)" }
            "::endgroup::"
          }

      - name: Check signing secrets
        id: sign
        shell: pwsh
        env:
          T: ${{ secrets.AZURE_TENANT_ID }}
          C: ${{ secrets.AZURE_CLIENT_ID }}
          S: ${{ secrets.AZURE_CLIENT_SECRET }}
          E: ${{ secrets.SIGNING_ENDPOINT }}
          A: ${{ secrets.SIGNING_ACCOUNT }}
          P: ${{ secrets.SIGNING_PROFILE }}
        run: |
          $ok = ($env:T -and $env:C -and $env:S -and $env:E -and $env:A -and $env:P) ? "true" : "false"
          "enabled=$ok" >> $env:GITHUB_OUTPUT
          "code signing: $ok"

      - name: Sign executables (Azure Trusted Signing)
        if: steps.sign.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: out
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          foreach ($arch in "x64", "arm64") {
            "::group::installer $arch"
            & $iscc "/DMyAppVersion=${{ env.VERSION }}" "/DMyAppFileVersion=${{ env.FILE_VERSION }}" "/DMyArch=$arch" "/DMySourceExe=..\out\sc-$arch\ImeBadge.exe" installer\ImeBadge.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC ($arch) failed ($LASTEXITCODE)" }
            "::endgroup::"
          }

      - name: Sign installer (Azure Trusted Signing)
        if: steps.sign.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: installer/Output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Collect outputs
        shell: pwsh
        run: |
          foreach ($arch in "x64", "arm64") {
            Copy-Item out/fd-$arch/ImeBadge.exe out/ImeBadge-win-$arch.exe
            Copy-Item out/sc-$arch/ImeBadge.exe out/ImeBadge-win-$arch-selfcontained.exe
            Copy-Item installer/Output/ImeBadge-Setup-${{ env.VERSION }}-$arch.exe out/
            # 롤링 사전 릴리스용 고정 이름. 버전이 든 이름으로 올리면 커밋마다 파일이 쌓여 덮어써지지 않는다.
            Copy-Item installer/Output/ImeBadge-Setup-${{ env.VERSION }}-$arch.exe out/ImeBadge-Setup-$arch.exe
          }
          Get-ChildItem out/*.exe | ForEach-Object { "{0,-48} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          Get-ChildItem out/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt

      # 브랜치 푸시마다 롤링 태그(latest / dev-<브랜치>)를 이 커밋으로 옮기고 사전 릴리스 첨부 파일을 갱신한다.
      # (Dependabot 이 미는 브랜치는 제외. 의존성 갱신마다 dev-dependabot-* 릴리스가 쌓이는 것을 막는다.)
      # 항상 같은 주소에서 최신 빌드를 받을 수 있다:
      #   https://github.com/<owner>/<repo>/releases/download/latest/ImeBadge-Setup-x64.exe
      #   https://github.com/<owner>/<repo>/releases/download/latest/ImeBadge-win-x64-selfcontained.exe
      #
      # 태그 푸시는 드물게 GitHub 쪽에서 거부된다("remote: fatal error in commit_refs"). 서버 일시 오류라
      # 몇 초 뒤 다시 하면 된다. 재시도가 없으면 이 단계에서 잡이 끝나 뒤따르는 릴리스 단계까지 건너뛴다.
      - name: Move rolling tag (브랜치 푸시일 때만)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.actor != 'dependabot[bot]'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false   # git 이 실패해도 끊지 않는다(직접 재시도하므로)
          git tag -f ${{ env.ROLLING_TAG }} ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($try in 1..3) {
            git push -f origin ${{ env.ROLLING_TAG }}
            if ($LASTEXITCODE -eq 0) { exit 0 }
            "rolling tag push failed (exit $LASTEXITCODE, try $try/3)"
            if ($try -lt 3) { Start-Sleep -Seconds (5 * $try) }
          }
          exit 1

      - name: Update rolling pre-release (브랜치 푸시일 때만)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.actor != 'dependabot[bot]'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.ROLLING_TAG }}
          name: "${{ env.ROLLING_TAG }} (${{ github.ref_name }} @ ${{ github.sha }})"
          body: "`${{ github.ref_name }}` 브랜치의 최신 자동 빌드입니다. 커밋마다 덮어써집니다. 검증된 버전은 v* 릴리스를 받으세요."
          prerelease: true
          files: |
            out/ImeBadge-Setup-x64.exe
            out/ImeBadge-Setup-arm64.exe
            out/ImeBadge-win-x64.exe
            out/ImeBadge-win-x64-selfcontained.exe
            out/ImeBadge-win-arm64.exe
            out/ImeBadge-win-arm64-selfcontained.exe
            out/SHA256SUMS.txt
            out/badge-sheet.png

      # 커밋 제목이 "release: vX.Y.Z" 이면 그 태그를 이 커밋에 만든다. 같은 태그가 이미 있으면 실패해서 알려 준다.
      # (GITHUB_TOKEN 으로 만든 태그는 워크플로를 다시 트리거하지 않으므로 아래 Release 단계가 같은 실행에서 이어진다)
      # 위와 같은 이유로 재시도한다. 같은 태그가 이미 있어서 거부된 경우라면 세 번 모두 같은 이유로 실패해
      # 결국 잡이 실패하므로, "이미 있으면 실패해서 알려 준다" 는 원래 동작은 그대로다(15초 늦어질 뿐).
      - name: "Create release tag (커밋 제목이 release: 일 때만)"
        if: env.RELEASE_TAG_FROM_COMMIT == 'True'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          git tag ${{ env.RELEASE_TAG }} ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($try in 1..3) {
            git push origin ${{ env.RELEASE_TAG }}
            if ($LASTEXITCODE -eq 0) { exit 0 }
            "release tag push failed (exit $LASTEXITCODE, try $try/3)"
            if ($try -lt 3) { Start-Sleep -Seconds (5 * $try) }
          }
          exit 1

      - name: "Release (태그 푸시 / release_tag 입력 / release: 커밋일 때만)"
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            out/ImeBadge-Setup-${{ env.VERSION }}-x64.exe
            out/ImeBadge-Setup-${{ env.VERSION }}-arm64.exe
            out/ImeBadge-win-x64.exe
            out/ImeBadge-win-x64-selfcontained.exe
            out/ImeBadge-win-arm64.exe
            out/ImeBadge-win-arm64-selfcontained.exe
            out/SHA256SUMS.txt

  # 정식 릴리스가 만들어졌으면 winget 매니페스트를 만들고(WINGET_TOKEN 이 있으면) microsoft/winget-pkgs 에 PR 을 낸다.
  winget:
    needs: build
    if: needs.build.outputs.release_tag != ''
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.build.outputs.release_tag }}
      submit: true
    secrets: inherit
